syntax = "proto3";

package auth;

// AuthService exposes registration and authentication RPCs for client accounts.
service AuthService {
  // Register creates a new account from email and password and returns an auth token.
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc ValidateEmail(ValidateEmailRequest) returns (ValidateEmailResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool   success = 1;
  string message = 2;
}

message RegisterRequest {
  string first_name = 1;
  string last_name  = 2;
  string email      = 3;
  string password   = 4;
}

message RegisterResponse {
  bool   success = 1;
  string message = 2;
  string verification_id = 3;
}

message ValidateEmailRequest {
  string verification_id = 1;
  int32  code          = 2;
  string type          = 3;
}

message ValidateEmailResponse {
  bool   success = 1;
  string message = 2;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  bool   success = 1;
  string message = 2;
  string token   = 3;
}

message LogoutRequest {
  string token = 1;
}

message LogoutResponse {
  bool   success = 1;
  string message = 2;
}
