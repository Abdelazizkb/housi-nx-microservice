version: '3.8'

services:
  housi-auth-db:
    image: postgres:15
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: auth_dev
      POSTGRES_PASSWORD: fake-local-password-123
      POSTGRES_DB: auth_service_dev
    volumes:
      - housi-auth-db-data:/var/lib/postgresql/data
  housi-users-service:
    image: postgres:15
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: users_db
    volumes:
      - housi-users-service-data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - '15672:15672'
      - '5672:5672'
    environment:
      RABBITMQ_HOST: '%'
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: root
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - '-q'
        - ping
      retries: 3
      timeout: 5s
      interval: 30s

volumes:
  housi-auth-db-data:
    driver: local
  housi-users-service-data:
    driver: local
  rabbitmq_data:
    driver: local
